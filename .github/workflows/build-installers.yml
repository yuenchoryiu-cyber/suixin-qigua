name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/make-icon.mjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: suixin-qigua-windows
          path: |
            release/suixin-qigua-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/make-icon.mjs
      - name: Build macOS installers
        run: npm run dist:mac
        env:
          # Unsigned shareable builds (no Apple Developer cert in CI)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: suixin-qigua-macos
          path: |
            release/suixin-qigua-*.dmg
            release/suixin-qigua-*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 随心起卦 ${{ github.ref_name }} — Pip-Boy 桌面起卦（Win / Mac）
          draft: false
          generate_release_notes: false
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            artifacts/suixin-qigua-windows/suixin-qigua-*
            artifacts/suixin-qigua-windows/latest.yml
            artifacts/suixin-qigua-macos/suixin-qigua-*
            artifacts/suixin-qigua-macos/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
